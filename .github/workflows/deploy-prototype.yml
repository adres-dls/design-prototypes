name: Deploy Prototype

on:
  push:
    branches:
      - "prototype/**"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Compute slug (branch name with the prototype/ prefix stripped)
        id: slug
        run: echo "slug=${GITHUB_REF_NAME#prototype/}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.slug.outputs.slug }}
          # Without this, this deploy would wipe every other slug's
          # previously-published output from gh-pages.
          keep_files: true
